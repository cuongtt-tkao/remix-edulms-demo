<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="55%" stop-color="#172554" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="pageLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="82%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#e2d9c2" />
    </linearGradient>
    <linearGradient id="pageRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2d9c2" />
      <stop offset="18%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
  </defs>

  <!-- Deep navy dignified rounded background -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" />
  <rect x="20" y="20" width="472" height="472" rx="100" fill="none" stroke="url(#goldGrad)" stroke-width="5" opacity="0.45" />

  <!-- Subtle halo behind book -->
  <ellipse cx="256" cy="240" rx="158" ry="118" fill="#fbbf24" opacity="0.08" />

  <!-- Golden outer hardcover backing -->
  <path
    d="M72 146 Q164 128 248 164 L264 164 Q348 128 440 146 C450 148 456 156 456 166 L456 368 C456 380 446 388 434 386 C348 366 286 384 256 402 C226 384 164 366 78 386 C66 388 56 380 56 368 L56 166 C56 156 62 148 72 146 Z"
    fill="url(#goldGrad)"
  />

  <!-- Left ivory page -->
  <path
    d="M84 134 C150 120 218 134 252 162 L252 368 C216 342 150 330 84 344 C76 346 72 340 72 332 L72 146 C72 138 76 135 84 134 Z"
    fill="url(#pageLeft)"
    stroke="#cbd5e1"
    stroke-width="2"
  />

  <!-- Right ivory page -->
  <path
    d="M428 134 C362 120 294 134 260 162 L260 368 C296 342 362 330 428 344 C436 346 440 340 440 332 L440 146 C440 138 436 135 428 134 Z"
    fill="url(#pageRight)"
    stroke="#cbd5e1"
    stroke-width="2"
  />

  <!-- Center spine crease -->
  <rect x="251" y="160" width="10" height="214" rx="5" fill="#94a3b8" opacity="0.45" />
  <line x1="256" y1="158" x2="256" y2="380" stroke="#78350f" stroke-width="4" stroke-linecap="round" opacity="0.55" />

  <!-- Crisp scripture text lines (scaled clearly for 16x16 visibility) -->
  <g stroke="#1e3a8a" stroke-width="11" stroke-linecap="round" opacity="0.72">
    <line x1="110" y1="190" x2="216" y2="198" />
    <line x1="110" y1="234" x2="216" y2="242" />
    <line x1="110" y1="278" x2="202" y2="285" />
  </g>
  <g stroke="#1e3a8a" stroke-width="11" stroke-linecap="round" opacity="0.72">
    <line x1="296" y1="198" x2="402" y2="190" />
    <line x1="296" y1="242" x2="402" y2="234" />
    <line x1="310" y1="285" x2="402" y2="278" />
  </g>

  <!-- Crimson/Gold Bookmark Ribbon hanging cleanly from center -->
  <path
    d="M240 368 L272 368 L272 444 L256 424 L240 444 Z"
    fill="#e11d48"
    stroke="#fef08a"
    stroke-width="3"
    stroke-linejoin="round"
  />
</svg>
